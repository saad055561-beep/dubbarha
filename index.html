<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#245a32">
<title>دبّرها</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f8f6;
 color:#17231b
}
header{
 background:#245a32;
 color:white;
 text-align:center;
 padding:38px 20px;
}
.logo{font-size:42px;font-weight:bold}
.tag{font-size:20px;margin-top:10px}
main{max-width:700px;margin:auto;padding:28px 18px}
.card{
 background:white;
 border-radius:24px;
 padding:28px 20px;
 box-shadow:0 8px 30px #0000000d;
 margin-bottom:20px
}
h1{font-size:32px;margin-top:0}
input{
 width:100%;
 padding:18px;
 border:2px solid #ddd;
 border-radius:16px;
 font-size:20px;
 direction:rtl;
}
button{
 width:100%;
 border:0;
 border-radius:15px;
 padding:16px;
 font-size:18px;
 cursor:pointer;
}
.primary{background:#245a32;color:white;margin-top:14px}
.secondary{background:#e8f3eb;color:#245a32;margin-top:10px}
.product{
 border:1px solid #dce5df;
 border-radius:20px;
 padding:20px;
 margin:16px 0;
 background:#fff
}
.product h2{margin:0 0 10px;font-size:23px}
.price{font-size:29px;font-weight:bold;color:#245a32}
.rating{margin:10px 0}
.spec{color:#68736c;line-height:1.8}
.badge{
 display:inline-block;
 background:#dcf6e3;
 color:#245a32;
 padding:8px 12px;
 border-radius:20px;
 margin-bottom:10px
}
.hidden{display:none}
.note{
 background:#f0f5f1;
 border-radius:14px;
 padding:14px;
 margin-top:15px;
 color:#526057
}
</style>
</head>

<body>

<header>
 <div class="logo">دبّرها</div>
 <div class="tag">قرارك أسهل مع دبّرها</div>
</header>

<main>

<section id="home" class="card">
 <h1>وش تبي تشتري؟</h1>

 <input id="search"
 placeholder="مثال: جوال 1000 ريال">

 <button class="primary" id="start">دبّرها لي</button>

 <div class="note">
 اكتب الشيء اللي تبيه وميزانيتك، وأنا أرتب لك أفضل الخيارات.
 </div>
</section>

<section id="results" class="card hidden">
 <h1>أفضل الخيارات لك</h1>
 <div id="list"></div>

 <button class="secondary" id="back">رجوع</button>
</section>

</main>

<script>

const products = [

 {
  name:"Samsung Galaxy A17 4G",
  price:719,
  rating:4.4,
  camera:7,
  battery:8,
  performance:6,
  screen:7,
  value:10,
  amazon:"https://www.amazon.sa/s?k=Samsung+Galaxy+A17+4G&tag=dubbarhe-21",
  noon:"https://www.noon.com/saudi-ar/search?q=Samsung%20Galaxy%20A17%204G"
 },

 {
  name:"Samsung Galaxy A26 5G",
  price:999,
  rating:4.4,
  camera:8,
  battery:8,
  performance:7,
  screen:8,
  value:9,
  amazon:"https://www.amazon.sa/s?k=Samsung+Galaxy+A26+5G&tag=dubbarhe-21",
  noon:"https://www.noon.com/saudi-ar/search?q=Samsung%20Galaxy%20A26%205G"
 },

 {
  name:"Samsung Galaxy A36 5G",
  price:1073,
  rating:4.0,
  camera:8,
  battery:9,
  performance:8,
  screen:9,
  value:8,
  amazon:"https://www.amazon.sa/s?k=Samsung+Galaxy+A36+5G&tag=dubbarhe-21",
  noon:"https://www.noon.com/saudi-ar/search?q=Samsung%20Galaxy+A36+5G"
 }

];

function getBudget(text){

 let numbers=text.replace(/,/g,"").match(/\d+(?:\.\d+)?/g);

 if(!numbers) return 1000;

 let nums=numbers.map(Number);

 return Math.max(...nums);
}

function score(p,budget){

 let priceScore;

 if(p.price<=budget){
  priceScore=10;
 }else{
  priceScore=Math.max(0,10-((p.price-budget)/budget)*10);
 }

 return (
  p.camera*0.25+
  p.battery*0.20+
  p.performance*0.15+
  p.screen*0.10+
  p.value*0.15+
  p.rating*2*0.05+
  priceScore*0.10
 );
}

function render(){

 let text=document.getElementById("search").value.trim();

 if(!text){
  alert("اكتب مثل: جوال 1000 ريال");
  return;
 }

 let budget=getBudget(text);

 let results=products
  .map(p=>({...p,score:score(p,budget)}))
  .sort((a,b)=>b.score-a.score);

 let affordable=results.filter(p=>p.price<=budget);

 if(affordable.length>0){
  results=affordable;
 }

 results=results.slice(0,3);

 let html="";

 results.forEach((p,i)=>{

  let badge=i===0
   ? '<div class="badge">⭐ اختيار دبّرها</div>'
   : "";

  html+=`
   <div class="product">

    ${badge}

    <h2>${p.name}</h2>

    <div class="price">${p.price.toLocaleString("ar-SA")} ريال</div>

    <div class="rating">⭐ التقييم: ${p.rating}</div>

    <div class="spec">
      كاميرا ${p.camera}/10 ·
      بطارية ${p.battery}/10 ·
      أداء ${p.performance}/10
    </div>

    <button class="primary"
      onclick="window.open('${p.amazon}','_blank')">
      شوف السعر في Amazon
    </button>

    <button class="primary"
      onclick="window.open('${p.noon}','_blank')">
      شوف السعر في Noon
    </button>

   </div>
  `;
 });

 if(results.length===0){
  html='<div class="note">ما لقيت خيار مناسب للميزانية.</div>';
 }

 document.getElementById("list").innerHTML=html;

 document.getElementById("home").classList.add("hidden");
 document.getElementById("results").classList.remove("hidden");

 window.scrollTo(0,0);
}

document.getElementById("start").addEventListener("click",render);

document.getElementById("back").addEventListener("click",function(){
 document.getElementById("results").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
 window.scrollTo(0,0);
});

</script>

</body>
</html>
