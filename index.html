<style>

*{box-sizing:border-box}

body{

margin:0;

font-family:Arial,sans-serif;

background:#f5f7f6;

color:#17231d;

}

header{

background:#087f5b;

color:white;

padding:20px;

border-radius:0 0 24px 24px;

}

header h1{margin:0;font-size:28px}

header p{margin:8px 0 0}

main{padding:20px;max-width:700px;margin:auto}

.card{

background:white;

padding:18px;

border-radius:18px;

margin-bottom:15px;

box-shadow:0 2px 10px #00000010;

}

input{

width:100%;

padding:16px;

border:1px solid #ddd;

border-radius:14px;

font-size:16px;

}

padding:14px 18px;

cursor:pointer;

}

.primary{

width:100%;

background:#087f5b;

color:white;

font-weight:bold;

}

.categories{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

margin-top:15px;

}

.cat{

background:#e9f7f2;

color:#087f5b;

font-weight:bold;

}

.product{

border:1px solid #eee;

border-radius:16px;

padding:16px;

margin:12px 0;

}

font-weight:bold;

.reason{

font-size:14px;

margin-top:8px;

}

nav{

position:fixed;

bottom:0;

left:0;

right:0;

background:white;

display:flex;

justify-content:space-around;

padding:12px 5px;

border-top:1px solid #ddd;

}

nav button{

background:white;

font-size:13px;

}

.hidden{display:none}

.back{

background:#eee;

margin-bottom:10px;

}

</style>

<div class="card">

<section id="account" class="hidden">

<button onclick="go('home')">✨<br>دبّرها</button>

<button onclick="go('home')">🏠<br>الرئيسية</button>

let prefs={

budget:2000,

category:null,

priority:'price'

function normalizeArabicNumbers(text){

const arabic='٠١٢٣٤٥٦٧٨٩';

const english='0123456789';

return text.replace(/[٠-٩]/g,function(d){

return english[arabic.indexOf(d)];

});

}

function detectCategory(text){

text=text.toLowerCase();

if(

/لابتوب|لابتوبات|لاب توب|حاسب محمول|كمبيوتر محمول/.test(text)

)return 'laptop';

if(

/جوال|جوالات|هاتف|هواتف|موبايل|موبايلات/.test(text)

)return 'phone';

if(

/سماعة|سماعات|هيدفون|headphone|سماعات أذن/.test(text)

)return 'headphones';

if(

/شاشة|شاشات|تلفزيون|تلفزيونات|tv/.test(text)

)return 'screen';

return null;

}

function detectPriority(text){

if(/كاميرا|تصوير/.test(text))

return 'camera';

if(/بطاري|بطارية/.test(text))

return 'battery';

if(/أداء|ألعاب|العاب|قوي/.test(text))

return 'performance';

if(/شاشة|وضوح|دقة/.test(text))

return 'screen';

return 'price';

}

function startSearch(){

let value=document.getElementById('searchInput').value.trim();

if(!value){

alert('اكتب الشيء الذي تريد شراءه أولاً');

return;

}

value=normalizeArabicNumbers(value);

let numbers=value.match(/\d[\d,]*/g);

if(numbers && numbers.length){

let nums=numbers.map(function(n){

return parseInt(n.replace(/,/g,''));

});

let budget=nums[nums.length-1];

if(budget>0){

prefs.budget=budget;

}

}

let category=detectCategory(value);

prefs.category=category;

prefs.priority=detectPriority(value);

renderResults();

go('results');

}

function quickSearch(text){

document.getElementById('searchInput').value=text;

startSearch();

}

function score(p){

let s=0;

if(p.price<=prefs.budget){

s+=40;

}else{

s-=Math.min(50,(p.price-prefs.budget)/20);

}

if(prefs.priority==='camera'){

s+=p.camera;

}

if(prefs.priority==='battery'){

s+=p.battery/50;

}

if(prefs.priority==='performance'){

s+=p.performance;

}

if(prefs.priority==='screen'){

s+=p.screen;

}

if(prefs.priority==='price'){

s+=(1000/Math.max(p.price,1))*30;

}

s+=p.rating*5;

return s;

}

function reason(p){

if(prefs.priority==='camera')
return 'اختيار مناسب إذا كانت الكاميرا أولوية لك.';

if(prefs.priority==='battery')
return 'اختيار مناسب إذا كانت البطارية أولوية لك.';

if(prefs.priority==='performance')
return 'اختيار مناسب إذا كان الأداء والألعاب أولوية لك.';

if(prefs.priority==='screen')
return 'اختيار مناسب إذا كانت الشاشة والوضوح أولوية لك.';

if(p.price<=prefs.budget)
return 'ضمن ميزانيتك ومناسب للاختيار.';

return 'أعلى قليلًا من ميزانيتك، لكنه خيار إضافي للمقارنة.';

}

function renderResults(){

let list=products.slice();

if(prefs.category){

list=list.filter(function(p){

return p.category===prefs.category;

});

}

list=list

.sort(function(a,b){

return score(b)-score(a);

});

let box=document.getElementById('resultsList');

document.getElementById('searchInfo').textContent=

'الميزانية: '+prefs.budget.toLocaleString()+' ريال';

if(!list.length){

box.innerHTML=

'<div class="product"><h3>لم نجد منتجًا مناسبًا</h3><p>جرّب رفع الميزانية قليلًا.</p></div>';

return;

}

box.innerHTML=list.map(function(p,index){

let amazon='https://www.amazon.sa/s?k='+encodeURIComponent(p.name)+'&tag=dabbirha-21';
const noonLinks={
'Samsung Galaxy A17 4G':'https://s.noon.com/Rnq7ICBj8rE',

function go(id){

</script>
