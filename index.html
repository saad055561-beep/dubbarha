<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>دبّرها</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7faf8;color:#17231b}
header{background:#14532d;color:#fff;padding:25px 18px;text-align:center}
.logo{font-size:34px;font-weight:bold}
.tag{margin-top:8px}
main{max-width:650px;margin:auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 4px 15px #0001}
h2{margin-top:0}
input{width:100%;padding:16px;border:1px solid #ddd;border-radius:12px;font-size:17px;margin:10px 0}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px}
.primary{background:#14532d;color:#fff;width:100%}
.option{background:#eef5f0;margin:5px;color:#14532d}
.hidden{display:none}
.product{border:1px solid #e2e8e4;border-radius:15px;padding:16px;margin:12px 0}
.product h3{margin:0 0 8px}
.price{font-size:24px;font-weight:bold;color:#14532d}
.small{color:#68736c;font-size:13px}
.badge{display:inline-block;background:#dcfce7;color:#166534;padding:6px 9px;border-radius:20px;font-size:13px}
a.buy{display:block;text-align:center;background:#14532d;color:#fff;text-decoration:none;padding:13px;border-radius:12px;margin-top:10px}
</style>
</head>
<body>

<header>
<div class="logo">دبّرها</div>
<div class="tag">قرارك أسهل مع دبّرها</div>
</header>

<main>

<div class="card" id="home">
<h2>وش تبي تشتري؟</h2>
<input id="searchInput" placeholder="مثال: جوال 1000 ريال">
<button class="primary" id="startBtn">دبّرها لي</button>
</div>

<div class="card hidden" id="questions">
<h2>وش أهم شيء عندك؟</h2>
<button class="option" data-use="تصوير">التصوير 📷</button>
<button class="option" data-use="بطارية">البطارية 🔋</button>
<button class="option" data-use="أداء">الأداء ⚡</button>
<button class="option" data-use="سعر">السعر 💰</button>
</div>

<div class="card hidden" id="results">
<h2>أفضل الخيارات لك</h2>
<div id="resultsList"></div>
<button class="primary" id="backBtn">بحث جديد</button>
</div>

</main>

<script>
const products=[
{
name:"Samsung Galaxy A17 4G",
price:719,
rating:4.4,
camera:7,
battery:8,
performance:6,
value:10,
amazon:"https://www.amazon.sa/s?k=Samsung+Galaxy+A17&tag=dubbarhe-21",
noon:"https://www.noon.com/saudi-ar/"
},
{
name:"Samsung Galaxy A26 5G",
price:999,
rating:4.4,
camera:8,
battery:8,
performance:7,
value:9,
amazon:"https://www.amazon.sa/s?k=Samsung+Galaxy+A26&tag=dubbarhe-21",
noon:"https://www.noon.com/saudi-ar/"
},
{
name:"Samsung Galaxy A36 5G",
price:1073,
rating:4.0,
camera:8,
battery:9,
performance:8,
value:8,
amazon:"https://www.amazon.sa/s?k=Samsung+Galaxy+A36&tag=dubbarhe-21",
noon:"https://www.noon.com/saudi-ar/"
}
];

let budget=0;
let use="";

function parseBudget(text){
const match=text.replace(/,/g,"").match(/(\d{3,5})/);
return match?Number(match[1]):1000;
}

function scoreProduct(p){
let score=p.value*2;

if(use==="تصوير") score+=p.camera*3;
if(use==="بطارية") score+=p.battery*3;
if(use==="أداء") score+=p.performance*3;
if(use==="سعر") score+=p.value*3;

return score;
}

function renderResults(){
const list=document.getElementById("resultsList");

let suitable=products.filter(p=>p.price<=budget);

if(suitable.length===0){
suitable=[...products].sort((a,b)=>a.price-b.price).slice(0,3);
}

suitable.sort((a,b)=>scoreProduct(b)-scoreProduct(a));

list.innerHTML=suitable.slice(0,3).map((p,i)=>`
<div class="product">
${i===0?'<span class="badge">⭐ اختيار دبّرها</span>':""}
<h3>${p.name}</h3>
<div class="price">${p.price.toLocaleString("ar-SA")} ريال</div>
<p>التقييم: ⭐ ${p.rating}</p>
<p class="small">
كاميرا ${p.camera}/10 · بطارية ${p.battery}/10 · أداء ${p.performance}/10
</p>
<a class="buy" href="${p.amazon}" target="_blank" rel="noopener">
شوف السعر في Amazon
</a>
<a class="buy" href="${p.noon}" target="_blank" rel="noopener">
شوف السعر في Noon
</a>
</div>
`).join("");
}

document.getElementById("startBtn").addEventListener("click",()=>{
const text=document.getElementById("searchInput").value.trim();

if(!text){
alert("اكتب وش تبي تشتري، مثال: جوال 1000 ريال");
return;
}

budget=parseBudget(text);

document.getElementById("home").classList.add("hidden");
document.getElementById("questions").classList.remove("hidden");
});

document.querySelectorAll(".option").forEach(btn=>{
btn.addEventListener("click",()=>{
use=btn.dataset.use;

document.getElementById("questions").classList.add("hidden");
document.getElementById("results").classList.remove("hidden");

renderResults();
});
});

document.getElementById("backBtn").addEventListener("click",()=>{
document.getElementById("results").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
});
</script>

</body>
</html>
